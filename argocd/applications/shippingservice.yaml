# Shipping quotes (Go)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shippingservice
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: online-boutique
    app.kubernetes.io/component: backend
    environment: cce-poc
  annotations:
    # Rollout order when bootstrapping via the root app:
    # -1 project, 0 data, 1 backends, 2 frontend, 3 tooling
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    # Deleting this Application also deletes its Kubernetes resources.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: online-boutique
  source:
    repoURL: https://github.com/ibrarclouddevops/cce-poc.git
    targetRevision: gitops
    path: apps/shippingservice/overlays/cce-poc
  destination:
    server: https://kubernetes.default.svc
    namespace: online-boutique
  syncPolicy:
    automated:
      prune: true      # remove resources deleted from git
      selfHeal: true   # revert manual kubectl changes
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
