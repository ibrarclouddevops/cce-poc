# ----------------------------------------------------------------------
# Argo CD app: loadgenerator - Fake shoppers that create test traffic - optional (Python)
#
# Keeps the folder services/loadgenerator/ (gitops branch) running in the
# 'online-boutique' namespace, and keeps it matching git:
#   - new commit in git     -> applied automatically
#   - manual change in k8s  -> changed back (selfHeal)
#   - file removed from git -> removed from k8s (prune)
# ----------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loadgenerator
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: online-boutique
    app.kubernetes.io/component: tooling
    environment: cce-poc
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # start order: 3 = last (test traffic)
  finalizers:
    # Deleting this Application also deletes its Kubernetes resources.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: online-boutique
  source:
    repoURL: https://github.com/ibrarclouddevops/cce-poc.git
    targetRevision: gitops
    path: services/loadgenerator
  destination:
    server: https://kubernetes.default.svc
    namespace: online-boutique
  syncPolicy:
    automated:
      prune: true      # remove resources deleted from git
      selfHeal: true   # revert manual kubectl changes
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
