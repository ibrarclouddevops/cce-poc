# ----------------------------------------------------------------------
# Argo CD project: platform - shared cluster tools
#
# Argo CD, cert-manager and NGINX Gateway Fabric install cluster-wide things (CRDs,
# ClusterRoles, webhooks), so they get their own project with wider rights
# than the shop. Only the namespaces and chart sources listed here are allowed.
# ----------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Cluster tools - Argo CD itself, certificates (cert-manager) and traffic (NGINX Gateway Fabric)
  sourceRepos:
    - https://github.com/ibrarclouddevops/cce-poc.git
    - https://charts.jetstack.io                         # cert-manager Helm chart
    - ghcr.io/nginx/charts                               # NGINX Gateway Fabric Helm chart (OCI)
    - ghcr.io/argoproj/argo-helm                         # Argo CD Helm chart (OCI)
    - https://github.com/kubernetes-sigs/gateway-api.git # Gateway API CRDs
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: nginx-gateway
    - server: https://kubernetes.default.svc
      namespace: argocd          # Argo CD itself + the argocd.antonx.com HTTPRoute
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
