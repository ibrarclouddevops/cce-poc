# ----------------------------------------------------------------------
# Argo CD project: online-boutique - the rules
#
# Every service app belongs to this project. It may only:
#   - use files from our GitHub repo
#   - deploy into the 'online-boutique' namespace of this cluster
# Inside that namespace any kind of resource is allowed.
# ----------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: online-boutique
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Online Boutique microservices on Huawei CCE (cce-poc)
  sourceRepos:
    - https://github.com/ibrarclouddevops/cce-poc.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: online-boutique
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # Any namespaced resource kind is allowed (still limited to the destinations above).
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true   # flag resources in the namespace that git doesn't know about
  roles:
    - name: read-only
      description: View Online Boutique apps
      policies:
        - p, proj:online-boutique:read-only, applications, get, online-boutique/*, allow
