# ----------------------------------------------------------------------
# Argo CD app: gateway-api-crds
#
# Installs the Kubernetes Gateway API resource types (Gateway, HTTPRoute...),
# version v1.5.1 - the one NGINX Gateway Fabric 2.6.8 is built for.
# Never pruned or deleted automatically: removing CRDs deletes every Gateway/route.
# ----------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-5"   # platform starts before the shop (negative = earlier)
spec:
  project: platform
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.5.1
    path: config/crd
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10
