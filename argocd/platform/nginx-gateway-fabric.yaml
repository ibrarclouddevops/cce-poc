# ----------------------------------------------------------------------
# Argo CD app: nginx-gateway-fabric
#
# Installs NGINX Gateway Fabric 2.6.8 with Helm: the front door that
# receives internet traffic (one Huawei ELB) and sends each subdomain to the
# right service. Settings: platform/nginx-gateway-fabric/values.yaml
# ----------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-gateway-fabric
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: platform
  annotations:
    argocd.argoproj.io/sync-wave: "-4"   # platform starts before the shop (negative = earlier)
  finalizers:
    # Deleting this Application also deletes what it installed.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    # 1) the Helm chart itself
    - repoURL: ghcr.io/nginx/charts
      chart: nginx-gateway-fabric
      targetRevision: 2.6.8
      helm:
        valueFiles:
          - $values/platform/nginx-gateway-fabric/values.yaml
    # 2) our settings for it, from this git branch
    - repoURL: https://github.com/ibrarclouddevops/cce-poc.git
      targetRevision: gitops
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10
