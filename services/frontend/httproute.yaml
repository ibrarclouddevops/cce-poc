# ----------------------------------------------------------------------
# frontend - HTTPRoute: https://shop.antonx.com
#
# Connects the public Gateway to the frontend Service.
# HTTPS, certificate and redirects are handled by the Gateway (platform/gateway).
# ----------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
spec:
  parentRefs:
    - name: public
      namespace: nginx-gateway
      sectionName: https-shop
  hostnames:
    - shop.antonx.com
  rules:
    - backendRefs:
        - name: frontend
          port: 80
