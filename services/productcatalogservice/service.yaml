# ----------------------------------------------------------------------
# productcatalogservice - Service
#
# A fixed name and port so other services can reach this one.
# ----------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: productcatalogservice
  labels:
    app: productcatalogservice
spec:
  type: ClusterIP
  selector:
    app: productcatalogservice
  ports:
  - name: grpc
    port: 3550
    targetPort: 3550
