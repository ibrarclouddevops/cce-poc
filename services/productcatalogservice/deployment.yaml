# ----------------------------------------------------------------------
# productcatalogservice - Deployment
#
# Tells Kubernetes how to run this service: which image, how many copies,
# how much CPU/memory, and how to check it is healthy.
# The image version is set in kustomization.yaml, not here.
# ----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
  labels:
    app: productcatalogservice
spec:
  selector:
    matchLabels:
      app: productcatalogservice
  template:
    metadata:
      labels:
        app: productcatalogservice
    spec:
      # Login used to download our private images from SWR (CCE creates it).
      imagePullSecrets:
        - name: default-secret
      # This service never talks to the Kubernetes API, so don't give it an API token.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: productcatalogservice
        ports:
        - containerPort: 3550
        env:
        - name: PORT
          value: "3550"
        - name: DISABLE_PROFILER
          value: "1"
        # Database connection (see services/postgres)
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_DB
          value: "boutique"
        - name: POSTGRES_USER
          value: "boutique"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        # Gives the service up to 2.5 minutes to connect to the database before
        # the normal health checks start (otherwise they would restart it too early).
        startupProbe:
          grpc:
            port: 3550
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          grpc:
            port: 3550
        livenessProbe:
          grpc:
            port: 3550
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
