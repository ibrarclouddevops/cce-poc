# ----------------------------------------------------------------------
# postgres - Deployment (no disk)
#
# Runs one PostgreSQL server. Data is kept in memory/node storage (emptyDir),
# so it is LOST when the pod restarts or moves - fine for this POC.
#
# After a postgres restart the tables are empty/missing. They are created
# (and the product list re-seeded) when the services start, so restart them:
#   kubectl -n online-boutique rollout restart deploy cartservice productcatalogservice
# ----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate   # never run two database pods at the same time
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # This service never talks to the Kubernetes API, so don't give it an API token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70     # 'postgres' user in the alpine image
        runAsGroup: 70
        fsGroup: 70
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        # The database 'boutique' and user 'boutique' are created on start.
        - name: POSTGRES_DB
          value: boutique
        - name: POSTGRES_USER
          value: boutique
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
        readinessProbe:
          exec:
            command: ["pg_isready", "-h", "127.0.0.1", "-U", "boutique", "-d", "boutique"]
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-h", "127.0.0.1", "-U", "boutique", "-d", "boutique"]
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: run
          mountPath: /var/run/postgresql
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        emptyDir: {}    # no persistent disk: data is gone when the pod is replaced
      - name: run
        emptyDir: {}
      - name: tmp
        emptyDir: {}
