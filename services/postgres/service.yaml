# ----------------------------------------------------------------------
# postgres - Service
#
# Other services connect to the database at postgres:5432.
# ----------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None   # headless: required by the StatefulSet, points straight at the pod
  selector:
    app: postgres
  ports:
  - name: tcp-postgres
    port: 5432
    targetPort: 5432
