# ----------------------------------------------------------------------
# postgres - Service
#
# Other services connect to the database at postgres:5432.
# ----------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP   # normal service: other pods connect to postgres:5432
  selector:
    app: postgres
  ports:
  - name: tcp-postgres
    port: 5432
    targetPort: 5432
