# ----------------------------------------------------------------------
# recommendationservice - Service
#
# A fixed name and port so other services can reach this one.
# ----------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  labels:
    app: recommendationservice
spec:
  type: ClusterIP
  selector:
    app: recommendationservice
  ports:
  - name: grpc
    port: 8080
    targetPort: 8080
