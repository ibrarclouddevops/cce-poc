# ----------------------------------------------------------------------
# shippingservice - Service
#
# A fixed name and port so other services can reach this one.
# ----------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: shippingservice
  labels:
    app: shippingservice
spec:
  type: ClusterIP
  selector:
    app: shippingservice
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
