# ----------------------------------------------------------------------
# https://argocd.antonx.com -> Argo CD dashboard
#
# Argo CD serves plain http behind the Gateway (the Gateway does TLS):
# set by 'server.insecure: true' in platform/argocd/values.yaml.
# CLI login through the Gateway: argocd login argocd.antonx.com --grpc-web
# ----------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: public
      namespace: nginx-gateway
      sectionName: https-argocd
  hostnames:
    - argocd.antonx.com
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
