# ----------------------------------------------------------------------
# http -> https redirect
#
# Anyone who opens http://shop.antonx.com is sent to https:// (permanent redirect).
# ----------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: nginx-gateway
spec:
  parentRefs:
    - name: public
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
