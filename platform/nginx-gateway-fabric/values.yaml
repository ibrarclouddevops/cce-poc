# ----------------------------------------------------------------------
# NGINX Gateway Fabric 2.6.8 - Helm values (our settings)
#
# Only what we change from the chart defaults. Full list of options:
# https://github.com/nginx/nginx-gateway-fabric/blob/v2.6.8/charts/nginx-gateway-fabric/values.yaml
# ----------------------------------------------------------------------

nginxGateway:
  # Gateways use 'gatewayClassName: nginx' to be handled by this install.
  gatewayClassName: nginx
  # Argo CD: create the GatewayClass LAST (wave 1), after the controller and its
  # config (NginxGateway) in wave 0. Otherwise Argo CD waits for the GatewayClass
  # to become healthy before creating the config the controller needs -> stuck.
  gatewayClassAnnotations:
    argocd.argoproj.io/sync-wave: '"1"'

nginx:
  # The NGINX pods that actually carry the traffic.
  replicas: 2   # two copies, so the site stays up if one node goes down
  config:
    # IPv4 only. The default (dual-stack IPv4+IPv6) is rejected by CCE:
    # "union elb not support ipv6 protocol".
    ipFamily: ipv4
  service:
    # NodePort service, published through the NAT Gateway (no ELB, no extra EIP:
    # the account has no EIP quota left).
    #   internet -> 192.232.52.130:80/443 (NAT Gateway DNAT rules)
    #            -> node 10.50.1.141:30080/30443 -> NGINX pods
    type: NodePort
    # Cluster = any node accepts the traffic and forwards it to an NGINX pod,
    # so the DNAT rule works whichever node the NGINX pods run on.
    externalTrafficPolicy: Cluster
    # Fixed ports, so the DNAT rules never need to change.
    nodePorts:
      - port: 30080
        listenerPort: 80
      - port: 30443
        listenerPort: 443
    # To use a public ELB later (needs EIP quota): set type: LoadBalancer, remove
    # nodePorts and add this patch:
    #   patches:
    #     - type: StrategicMerge
    #       value:
    #         metadata:
    #           annotations:
    #             kubernetes.io/elb.class: union
    #             kubernetes.io/elb.autocreate: '{"type":"public","bandwidth_name":"cce-poc-gateway","bandwidth_chargemode":"traffic","bandwidth_size":10,"bandwidth_sharetype":"PER","eip_type":"5_bgp"}'
