# ----------------------------------------------------------------------
# NGINX Gateway Fabric 2.6.8 - Helm values (our settings)
#
# Only what we change from the chart defaults. Full list of options:
# https://github.com/nginx/nginx-gateway-fabric/blob/v2.6.8/charts/nginx-gateway-fabric/values.yaml
# ----------------------------------------------------------------------

nginxGateway:
  # Gateways use 'gatewayClassName: nginx' to be handled by this install.
  gatewayClassName: nginx

nginx:
  # The NGINX pods that actually carry the traffic.
  replicas: 2   # two copies, so the site stays up if one node goes down
  service:
    # One Huawei ELB with one public IP for all subdomains.
    type: LoadBalancer
    externalTrafficPolicy: Local   # keeps the real visitor IP in logs
    # CCE creates the ELB for us from these annotations (no manual ELB needed).
    # NOTE: deleting this Service (or the nginx-gateway-fabric Argo app) also deletes
    # the ELB and its public IP; a new one gets a NEW IP, so update Cloudflare DNS then.
    patches:
      - type: StrategicMerge
        value:
          metadata:
            annotations:
              # Shared ELB = the cheaper type (fine for this POC).
              kubernetes.io/elb.class: union
              # Create a public ELB with a new EIP: 5 Mbit/s, billed by traffic used.
              # eip_type is the EIP "line type" - if Indus Cloud names it differently,
              # `kubectl -n nginx-gateway describe svc` shows an error; change it here.
              kubernetes.io/elb.autocreate: '{"type":"public","bandwidth_name":"cce-poc-gateway","bandwidth_chargemode":"traffic","bandwidth_size":5,"bandwidth_sharetype":"PER","eip_type":"5_bgp"}'
