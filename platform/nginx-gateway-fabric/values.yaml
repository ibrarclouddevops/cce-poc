# ----------------------------------------------------------------------
# NGINX Gateway Fabric 2.6.8 - Helm values (our settings)
#
# Only what we change from the chart defaults. Full list of options:
# https://github.com/nginx/nginx-gateway-fabric/blob/v2.6.8/charts/nginx-gateway-fabric/values.yaml
# ----------------------------------------------------------------------

nginxGateway:
  # Gateways use 'gatewayClassName: nginx' to be handled by this install.
  gatewayClassName: nginx
  # Argo CD: create the GatewayClass LAST (wave 1), after the controller and its
  # config (NginxGateway) in wave 0. Otherwise Argo CD waits for the GatewayClass
  # to become healthy before creating the config the controller needs -> stuck.
  gatewayClassAnnotations:
    argocd.argoproj.io/sync-wave: '"1"'

nginx:
  # The NGINX pods that actually carry the traffic.
  replicas: 2   # two copies, so the site stays up if one node goes down
  config:
    # IPv4 only. The default (dual-stack IPv4+IPv6) is rejected by CCE:
    # "union elb not support ipv6 protocol".
    ipFamily: ipv4
  service:
    # One PRIVATE Huawei ELB (no EIP) in front of the NGINX pods.
    # The account has no EIP quota left, so the public IP is the NAT Gateway's EIP
    # (192.232.52.130) with DNAT rules 80/443 -> this ELB's private IP.
    #   internet -> 192.232.52.130 (NAT DNAT) -> private ELB 10.50.1.x -> NGINX pods
    type: LoadBalancer
    externalTrafficPolicy: Local   # keeps the real visitor IP in logs
    # CCE creates the ELB for us from these annotations.
    # NOTE: deleting this Service (or the nginx-gateway-fabric Argo app) also deletes the
    # ELB; the new one gets a new private IP, so update the 2 DNAT rules then.
    patches:
      - type: StrategicMerge
        value:
          metadata:
            annotations:
              # Shared ELB = the cheaper type (fine for this POC).
              kubernetes.io/elb.class: union
              # Private ELB (type inner): no EIP needed.
              # To use a public ELB later (needs EIP quota), replace with:
              #   '{"type":"public","bandwidth_name":"cce-poc-gateway","bandwidth_chargemode":"traffic","bandwidth_size":10,"bandwidth_sharetype":"PER","eip_type":"5_bgp"}'
              kubernetes.io/elb.autocreate: '{"type":"inner","name":"cce-poc-gateway"}'
