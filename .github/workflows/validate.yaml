# Checks every service folder still builds, before Argo CD tries to deploy it.
name: validate-gitops

on:
  push:
    branches: [gitops]
  pull_request:
    branches: [gitops]

permissions:
  contents: read

jobs:
  kustomize-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build every service folder
        run: |
          set -e
          for d in services/*/; do
            kubectl kustomize "$d" > /dev/null
            echo "ok $d"
          done

      - name: Check Argo CD files are valid YAML
        run: |
          for f in root-app.yaml argocd/project.yaml argocd/apps/*.yaml; do
            python3 -c "import sys,yaml; yaml.safe_load(open(sys.argv[1]))" "$f" && echo "ok $f"
          done
