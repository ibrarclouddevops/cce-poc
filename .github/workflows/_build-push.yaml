# Reusable workflow: builds one service image and pushes it to the Indus Cloud registry.
# Called by the per-service pipelines (build-<service>.yaml).
#
# ---- Configure these in GitHub: Settings > Secrets and variables > Actions ----
# Variables (Variables tab):
#   REGISTRY_URL        e.g. swr.pk-icln-1.indus-cloud.com    (registry host only)
#   REGISTRY_NAMESPACE  e.g. cce-poc                          (SWR organization)
#   REGISTRY_INSECURE   optional: "true" if the registry TLS cert doesn't match its hostname
#                       (Indus Cloud SWR currently serves a default Huawei cert with no SAN)
# Secrets (Secrets tab):
#   REGISTRY_USERNAME   registry login user
#   REGISTRY_PASSWORD   registry password / access token
#
# Final image: <REGISTRY_URL>/<REGISTRY_NAMESPACE>/<service>:<git-sha> (and :latest on main)

name: _build-push (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: Image name (e.g. frontend)
        required: true
        type: string
      context:
        description: Docker build context (folder with the Dockerfile)
        required: true
        type: string
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-24.04
    env:
      REGISTRY_URL: ${{ vars.REGISTRY_URL }}
      REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check registry settings
        run: |
          if [ -z "$REGISTRY_URL" ] || [ -z "$REGISTRY_NAMESPACE" ]; then
            echo "::error::Set REGISTRY_URL and REGISTRY_NAMESPACE under Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      - name: Compute image name and tags
        id: meta
        run: |
          IMAGE="${REGISTRY_URL}/${REGISTRY_NAMESPACE}/${{ inputs.service }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS="${IMAGE}:${SHORT_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Trust registry with invalid TLS cert (REGISTRY_INSECURE=true)
        if: vars.REGISTRY_INSECURE == 'true'
        run: |
          echo "{\"insecure-registries\": [\"${REGISTRY_URL}\"]}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          printf '[registry."%s"]\n  insecure = true\n' "${REGISTRY_URL}" > "${RUNNER_TEMP}/buildkitd.toml"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config: ${{ vars.REGISTRY_INSECURE == 'true' && format('{0}/buildkitd.toml', runner.temp) || '' }}

      - name: Log in to Indus Cloud registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ inputs.service }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}

      - name: Summary
        run: |
          echo "### Pushed ${{ inputs.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' | tr ',' '\n' | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
