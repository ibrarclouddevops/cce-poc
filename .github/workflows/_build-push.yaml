# Reusable workflow: builds one service image and pushes it to the Indus Cloud registry.
# Called by the per-service pipelines (build-<service>.yaml).
#
# ---- Configure these in GitHub: Settings > Secrets and variables > Actions ----
# Variables (Variables tab):
#   REGISTRY_URL        e.g. swr.pk-icln-1.indus-cloud.com    (registry host only)
#   REGISTRY_NAMESPACE  e.g. cce-poc                          (SWR organization)
#   REGISTRY_INSECURE   optional: "true" if the registry TLS cert doesn't match its hostname
#                       (Indus Cloud SWR currently serves a default Huawei cert with no SAN)
# Secrets (Secrets tab):
#   REGISTRY_USERNAME   registry login user
#   REGISTRY_PASSWORD   registry password / access token
#
# Final image: <REGISTRY_URL>/<REGISTRY_NAMESPACE>/<service>:<git-sha> (and :latest on main)

name: _build-push (reusable)

on:
  workflow_call:
    inputs:
      service:
        description: Image name (e.g. frontend)
        required: true
        type: string
      context:
        description: Docker build context (folder with the Dockerfile)
        required: true
        type: string
    secrets:
      REGISTRY_USERNAME:
        required: true
      REGISTRY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    env:
      REGISTRY_URL: ${{ vars.REGISTRY_URL }}
      REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check registry settings
        run: |
          if [ -z "$REGISTRY_URL" ] || [ -z "$REGISTRY_NAMESPACE" ]; then
            echo "::error::Set REGISTRY_URL and REGISTRY_NAMESPACE under Settings > Secrets and variables > Actions > Variables"
            exit 1
          fi

      - name: Compute image name and tags
        id: meta
        run: |
          IMAGE="${REGISTRY_URL}/${REGISTRY_NAMESPACE}/${{ inputs.service }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAGS="${IMAGE}:${SHORT_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Trust registry with invalid TLS cert (REGISTRY_INSECURE=true)
        if: vars.REGISTRY_INSECURE == 'true'
        run: |
          echo "{\"insecure-registries\": [\"${REGISTRY_URL}\"], \"max-concurrent-uploads\": 2}" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      # The registry link from GitHub runners is slow/flaky (timeouts), so retry with backoff.
      - name: Log in to Indus Cloud registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          for i in 1 2 3 4 5; do
            echo "$REGISTRY_PASSWORD" | docker login -u "$REGISTRY_USERNAME" --password-stdin "$REGISTRY_URL" && exit 0
            echo "Login attempt $i failed, retrying in $((i*15))s..."; sleep $((i*15))
          done
          exit 1

      # Plain docker build/push (not buildx): pushes go through the docker daemon,
      # which honors insecure-registries for the registry's token endpoint too.
      - name: Build image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          CONTEXT: ${{ inputs.context }}
        run: |
          TAG_ARGS=""
          for t in ${TAGS//,/ }; do TAG_ARGS="$TAG_ARGS -t $t"; done
          docker build --platform linux/amd64 $TAG_ARGS "$CONTEXT"

      - name: Push image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in ${TAGS//,/ }; do
            for i in 1 2 3 4 5; do
              docker push "$t" && break
              [ "$i" = 5 ] && { echo "::error::Push of $t failed after 5 attempts"; exit 1; }
              echo "Push attempt $i failed, retrying in $((i*20))s..."; sleep $((i*20))
            done
          done

      - name: Log out of registry
        if: always()
        run: docker logout "$REGISTRY_URL" || true

  # GitOps: record the new image tag on the gitops branch; Argo CD then deploys it.
  update-gitops:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # push to the gitops branch
    env:
      SERVICE: ${{ inputs.service }}
      IMAGE: ${{ needs.build-push.outputs.image }}
      TAG: ${{ needs.build-push.outputs.tag }}
      GITOPS_BRANCH: gitops
      OVERLAY: services/${{ inputs.service }}/kustomization.yaml
    steps:
      - name: Checkout gitops branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GITOPS_BRANCH }}

      - name: Bump image tag, commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"

          bump() {
            [ -f "$OVERLAY" ] || { echo "::error::$OVERLAY not found on $GITOPS_BRANCH"; exit 1; }
            # change only the values, keep any trailing comments
            sed -i -E "s|^(\s*newName:\s*)[^[:space:]#]+|\1${IMAGE}|; s|^(\s*newTag:\s*)\"?[^\"[:space:]#]*\"?|\1\"${TAG}\"|" "$OVERLAY"
          }

          bump
          if git diff --quiet; then
            echo "$SERVICE already at $TAG on $GITOPS_BRANCH - nothing to do"; exit 0
          fi
          git diff
          git commit -am "deploy($SERVICE): $TAG" \
            -m "Image: ${IMAGE}:${TAG}" \
            -m "Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            -m "Pipeline: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Several service pipelines may push at once: rebase and retry on conflict.
          for i in 1 2 3 4 5; do
            git push origin "HEAD:${GITOPS_BRANCH}" && break
            [ "$i" = 5 ] && { echo "::error::Could not push to $GITOPS_BRANCH"; exit 1; }
            echo "Push rejected (attempt $i), rebasing..."; sleep $((RANDOM % 5 + i * 3))
            git fetch origin "$GITOPS_BRANCH"
            if ! git rebase "origin/${GITOPS_BRANCH}"; then
              # Only this service's overlay is ours: take theirs, re-apply our bump.
              git rebase --abort
              git reset --hard "origin/${GITOPS_BRANCH}"
              bump
              git commit -am "deploy($SERVICE): $TAG"
            fi
          done

          echo "### GitOps updated" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$OVERLAY\` → \`${IMAGE}:${TAG}\` on \`$GITOPS_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          echo "### Pushed ${{ inputs.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' | tr ',' '\n' | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
